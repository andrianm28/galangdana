name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: galangdana
          POSTGRES_PASSWORD: galangdana
          POSTGRES_DB: galangdana
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U galangdana"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.11
        env:
          MEILI_MASTER_KEY: galangdana-dev-master-key
          MEILI_NO_ANALYTICS: "true"
        ports: ["7700:7700"]
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:7700/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # No imgproxy service container here (there used to be one -- see git
      # history / prior task reports if resurrecting this reasoning is ever
      # needed): confirmed, while fixing a final-review finding, that
      # nothing in this job actually makes a real HTTP request to imgproxy.
      # buildImgproxyUrl (see the IMGPROXY_KEY/IMGPROXY_BASE_URL comment
      # below) is pure HMAC URL-signing with no network call, and
      # scripts/check-links.ts's crawler only follows same-origin `<a
      # href>` links -- it explicitly skips any href starting with "http"
      # (see that script), and never inspects `<img src>` at all, so the
      # `http://localhost:8090/...` cover-image URLs rendered on the page
      # are never fetched by CI either way. A service container would also
      # be unable to actually serve those URLs even if something did reach
      # it: MEDIA_SOURCE_BASE_URL below points at localhost:9000 (MinIO),
      # which is unreachable from inside a `services:` container's own
      # isolated network namespace -- `localhost` there resolves to the
      # container itself, not the runner host MinIO is published on. If a
      # real end-to-end image-serving assertion is wanted later, it needs a
      # `docker run --network host ...` step (like "Create media bucket"
      # below), not a `services:` entry.
    env:
      # Port 5432 here (not 55434) is correct and intentional: this runs in
      # an isolated GitHub Actions runner with its own services:postgres
      # container above, bound to the default 5432 with no collision — the
      # 55434 port only exists to dodge an unrelated container on the shared
      # dev machine this plan is executed on (see Task 2's port note).
      DATABASE_URL: postgres://galangdana:galangdana@localhost:5432/galangdana
      REDIS_URL: redis://localhost:6379
      # packages/search's tests hit a real Meilisearch instance (no mocking,
      # matching this codebase's established "tests use real infrastructure"
      # pattern) -- these two match packages/search/src/client.ts's hardcoded
      # fallbacks exactly, so they're redundant with the defaults, but kept
      # explicit here for the same reason DATABASE_URL/REDIS_URL are: this
      # job's services are the source of truth for what "real" means in CI.
      MEILISEARCH_URL: http://localhost:7700
      MEILISEARCH_API_KEY: galangdana-dev-master-key
      PUBLIC_API_URL: http://localhost:3001
      # apps/api's GET /campaigns (Task 6) signs a real imgproxy URL for
      # every row server-side via @galangdana/media's buildImgproxyUrl --
      # pure HMAC signing, no network call, so no imgproxy/MinIO service
      # container is needed here, but the key/salt must be non-empty or
      # Web Crypto's importKey throws "Zero-length key is not supported".
      # Values match .env.example / docker-compose.yml's imgproxy service
      # defaults exactly, same as the MEILISEARCH_* pair above.
      IMGPROXY_KEY: 4ac5d314cc578f0216d080c03b2bc517a7e4226af8a4ed6a5617cf94e44c554c
      IMGPROXY_SALT: 00325181fcb6c7a7ef94ba22eab86f3115ddfaf7178dcba96d19a327c0ab65f1
      IMGPROXY_BASE_URL: http://localhost:8090
      MEDIA_SOURCE_BASE_URL: http://localhost:9000/campaign-media
      # packages/db/src/seed/upload-cover-images.ts's Bun.S3Client -- these
      # match that file's own fallback defaults exactly (same as the
      # MEILISEARCH_*/IMGPROXY_* pairs above), kept explicit for the same
      # reason: this job's services are the source of truth for "real"
      # here, not a script's hardcoded fallback.
      MEDIA_S3_ENDPOINT: http://localhost:9000
      MEDIA_S3_ACCESS_KEY_ID: galangdana
      MEDIA_S3_SECRET_ACCESS_KEY: galangdana-dev-secret
      MEDIA_S3_BUCKET: campaign-media
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Not a services: entry: that schema has no command/entrypoint
      # override (confirmed against GitHub's own docs and community
      # discussion #52675), and the plain minio/minio image's default CMD
      # just prints usage and exits without binding port 9000. A `docker
      # run` step has no such restriction, so this uses the real, official,
      # actively-maintained image with its actual `server /data` command --
      # the container is reachable at localhost:9000 exactly like a
      # services: container would be, since this job has no `container:` key.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=galangdana \
            -e MINIO_ROOT_PASSWORD=galangdana-dev-secret \
            minio/minio:latest server /data

      - name: Wait for MinIO
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "MinIO did not start in time" >&2
          exit 1

      - name: Lint
        run: bun run lint

      - name: Run database migrations
        run: bun run db:migrate

      - name: Create media bucket
        # MinIO's bucket-creation API needs a real SigV4-signed request, and
        # the anonymous-download policy imgproxy needs to fetch objects
        # unauthenticated (packages/media's buildImgproxyUrl signs a URL
        # imgproxy fetches with a plain unauthenticated GET -- see
        # packages/media/src/imgproxy.ts) is a separate policy call a plain
        # PUT has no equivalent for at all -- confirmed directly: an
        # unsigned `curl -X PUT` against a real MinIO instance is rejected,
        # and even a successful bucket creation with no policy set leaves
        # anonymous GETs on it 403ing. This uses the official minio/mc
        # image against the minio service's published localhost:9000 port,
        # the same operations Task 3's own documented local-dev command
        # runs via `docker compose exec minio mc ...` (not usable here,
        # since a GitHub Actions service container isn't reachable via
        # `docker compose exec`) -- verified end-to-end locally: this exact
        # command sequence, then a real `upload-cover-images.ts` run, then
        # an anonymous curl GET of an uploaded object, all succeeded (see
        # Task 14's report).
        #
        # Also creates campaign-documents here (same `mc alias`/`mc mb`
        # invocation, same job, same step -- just a second target bucket):
        # apps/api/src/routes/campaign-drafts.ts's presigned-upload flow
        # defaults to this bucket (MEDIA_S3_PRIVATE_BUCKET, unset in CI) and
        # campaign-drafts.test.ts does a real PUT against a real presigned
        # URL into it, so without this the bucket doesn't exist in a fresh
        # CI run and MinIO 404s the PUT with NoSuchBucket -- this passed
        # locally only because a developer had created the bucket manually
        # at some point. Deliberately WITHOUT `mc anonymous set download`:
        # unlike campaign-media, campaign-documents holds private
        # evidentiary uploads (medical records, ID cards) and must stay
        # non-public.
        run: |
          docker run --rm --network host --entrypoint sh minio/mc -c "
            mc alias set local http://localhost:9000 galangdana galangdana-dev-secret &&
            mc mb --ignore-existing local/campaign-media &&
            mc anonymous set download local/campaign-media &&
            mc mb --ignore-existing local/campaign-documents
          "

      # Task 6's apps/api/src/routes/campaigns.test.ts asserts against the
      # real seed fixture data (8 campaigns, the "zakat" category, etc.) --
      # it needs that data to already exist. `bun test`'s file-execution
      # order is NOT the order these directories are listed in below (it
      # runs "apps/..." files before "packages/..." files, confirmed by
      # running the exact command and observing per-file output order), so
      # packages/db's categories.test.ts calling runSeed() as a side effect
      # cannot be relied on to have happened yet by the time apps/api's
      # tests run. An explicit, idempotent (onConflictDoNothing /
      # find-or-create) seed step here removes that ordering dependency.
      - name: Seed database
        run: bun run db:seed

      - name: Upload seed cover images
        run: bun run src/seed/upload-cover-images.ts
        working-directory: packages/db

      - name: Reindex search
        run: bun run reindex
        working-directory: packages/search

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests (packages + api)
        run: bun run test

      - name: Unit tests (web)
        run: bun run test:web

      - name: Unit tests (ui)
        run: bun run test:ui

      - name: Build web
        run: bun run --cwd apps/web build

      - name: Start API in background
        run: bun run --cwd apps/api start &

      - name: Wait for API
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3001/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "API did not start in time" >&2
          exit 1

      - name: Start web preview in background
        run: bun run --cwd apps/web preview --port 5173 &

      - name: Wait for web server
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "web server did not start in time" >&2
          exit 1

      - name: Link check
        run: bun run scripts/check-links.ts
        env:
          CHECK_LINKS_BASE_URL: http://localhost:5173
          # /explore/bencana-alam is included because the homepage has no
          # link to any /explore/[category] page yet (a separately-tracked,
          # deliberately-deferred gap, not fixed here) -- without an extra
          # seed path here, the crawler starting from "/" would never reach
          # that route at all. bencana-alam is one of the seeded categories
          # with a real seeded campaign in it (packages/db/src/seed/
          # categories.seed.ts + campaigns.seed.ts), so this exercises a
          # real, non-empty /explore/[category] page.
          CHECK_LINKS_EXTRA_ROUTES: /search?q=banjir,/explore/bencana-alam

  deploy:
    name: Deploy to fundforindonesia.org
    needs: test
    # Runs ONLY on a real push to master, never for a pull_request -- this
    # job executes on a self-hosted runner living on the production host
    # itself, and this repo is public. A self-hosted runner triggered by
    # pull_request (or pull_request_target) would let anyone who can open a
    # PR run arbitrary code on this host via a malicious workflow-file
    # change in their fork. Gating on push+master instead means this job
    # only ever runs for someone who already has write access and merged
    # through the now-protected branch (required PR + required checks) --
    # the same trust level as SSH access to this host, not "anyone with a
    # GitHub account."
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, galangdana-deploy]
    concurrency:
      # Prevents two overlapping deploys (e.g. two merges in quick
      # succession) from racing each other's git reset/build/restart.
      group: galangdana-production-deploy
      cancel-in-progress: false
    steps:
      # Deliberately not actions/checkout@v4: that checks out into the
      # runner's own _work/ workspace, which the running systemd services
      # (galangdana-api.service / galangdana-web.service) know nothing
      # about -- their WorkingDirectory is /home/ubuntu/galangdana, the
      # same real checkout used throughout this project's manual deploys
      # so far. This job updates that checkout in place instead.
      - name: Update the live checkout
        working-directory: /home/ubuntu/galangdana
        run: |
          git fetch origin master
          git reset --hard origin/master

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: /home/ubuntu/galangdana
        run: bun install

      - name: Run database migrations
        working-directory: /home/ubuntu/galangdana
        # Explicit --env-file rather than relying on Bun's ambient .env
        # auto-load: .env.production is what the live services actually
        # run with (see galangdana-api.service / galangdana-web.service's
        # EnvironmentFile=), and today it happens to point at the same
        # database as local dev .env -- but being explicit here means this
        # keeps doing the right thing once dev/staging/prod databases
        # actually split (see the project's own "single environment until
        # launch" note), rather than silently depending on which .env file
        # Bun's auto-load happens to prefer.
        run: bun --env-file=.env.production run db:migrate

      - name: Build web
        working-directory: /home/ubuntu/galangdana
        run: bun run build

      - name: Restart services
        # systemctl --user needs XDG_RUNTIME_DIR explicitly set here: this
        # job runs inside the runner's own systemd *system* service (see
        # actions.runner.*.service, installed via svc.sh), which doesn't
        # automatically inherit the ubuntu user's systemd --user session
        # environment the way an interactive login shell would. Verified
        # this exact env var is sufficient via `sudo systemd-run --uid=ubuntu
        # -p Environment=XDG_RUNTIME_DIR=/run/user/1000 systemctl --user
        # status galangdana-web.service` before wiring this up.
        run: |
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          systemctl --user restart galangdana-api.service
          systemctl --user restart galangdana-web.service

      - name: Health check
        run: |
          for i in $(seq 1 30); do
            api_code=$(curl -sf -o /dev/null -w "%{http_code}" https://api.fundforindonesia.org/healthz || echo "000")
            web_code=$(curl -sf -o /dev/null -w "%{http_code}" https://fundforindonesia.org/ || echo "000")
            if [ "$api_code" = "200" ] && [ "$web_code" = "200" ]; then
              echo "Deploy healthy (api=$api_code web=$web_code)"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed after restart (api=$api_code web=$web_code)" >&2
          exit 1
