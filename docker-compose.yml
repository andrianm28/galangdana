name: galangdana

# Every published port below is bound to 127.0.0.1 explicitly, not left as
# the bare "host:container" form (which Docker publishes on 0.0.0.0 by
# default). This host runs this compose file in production, and the bare
# form was found, on audit, published on all interfaces with this host's
# own firewall unable to stop it -- Docker's NAT/FORWARD rules bypass UFW's
# INPUT chain entirely, which is a well-known Docker+UFW interaction, not a
# misconfiguration specific to this host. Every consumer of these services
# (this repo's own apps, `bun run db:migrate`, etc.) already connects via
# "localhost"/127.0.0.1, so this has no functional effect on local dev or
# on the deployed services -- it only removes the external-facing bind.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: galangdana
      POSTGRES_PASSWORD: galangdana
      POSTGRES_DB: galangdana
    ports: ["127.0.0.1:55434:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U galangdana"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: galangdana
      MINIO_ROOT_PASSWORD: galangdana-dev-secret
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10

  imgproxy:
    image: darthsim/imgproxy:latest
    # Dev-only: network_mode: host (not the bridge + "ports:" mapping used
    # by every other service here) so imgproxy's own container shares the
    # host's network namespace. Source URLs signed by this package point at
    # http://localhost:9000/... (MinIO's host-mapped port, per
    # MEDIA_SOURCE_BASE_URL below) -- under ordinary bridge networking,
    # "localhost" inside the imgproxy container resolves to the container
    # itself, not the host, and every fetch 404s with "Source is
    # unreachable" (confirmed directly: switching this service to bridge +
    # port-mapping, matching the pattern of the other services, reproduces
    # that 404 even with IMGPROXY_ALLOW_LOOPBACK_SOURCE_ADDRESSES=true).
    # Host networking is how this scheme was actually verified during this
    # plan's research. Never do this in a real deployment, where the media
    # source is a real, non-loopback host and imgproxy runs alongside other
    # properly-isolated services.
    network_mode: host
    environment:
      IMGPROXY_KEY: ${IMGPROXY_KEY:-4ac5d314cc578f0216d080c03b2bc517a7e4226af8a4ed6a5617cf94e44c554c}
      IMGPROXY_SALT: ${IMGPROXY_SALT:-00325181fcb6c7a7ef94ba22eab86f3115ddfaf7178dcba96d19a327c0ab65f1}
      # Dev-only: MinIO is reached at localhost/127.0.0.1 from the host
      # machine (see the port mapping on the minio service below), and
      # imgproxy refuses loopback source addresses by default as an SSRF
      # protection -- verified directly (a signed, correctly-formed
      # request 404s with "Loopback source address is not allowed"
      # without this). Never set this in a real deployment, where the
      # media source is a real, non-loopback host.
      IMGPROXY_ALLOW_LOOPBACK_SOURCE_ADDRESSES: "true"
      # With network_mode: host there's no "ports:" mapping to remap
      # imgproxy's default :8080 to the host's 8090 -- imgproxy has to
      # actually listen on 8090 itself so it matches
      # IMGPROXY_BASE_URL=http://localhost:8090 in .env.example.
      IMGPROXY_BIND: ":8090"
    healthcheck:
      test: ["CMD", "imgproxy", "health"]
      interval: 5s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    environment:
      MEILI_MASTER_KEY: galangdana-dev-master-key
      MEILI_NO_ANALYTICS: "true"
    ports: ["127.0.0.1:7700:7700"]
    volumes: ["meilidata:/meili_data"]
    healthcheck:
      # 127.0.0.1, not localhost: the getmeili/meilisearch image binds
      # IPv4-only (0.0.0.0:7700), but this container's musl/busybox wget
      # resolves "localhost" to ::1 first and gets refused there before ever
      # trying IPv4 — confirmed by exec'ing in and diffing `wget localhost`
      # (refused) against `wget 127.0.0.1` (succeeds) plus `ss -tlnp` showing
      # no :::7700 listener. mailpit's healthcheck can keep "localhost" —
      # its image listens dual-stack (:::8025), so it isn't affected.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
  meilidata:
